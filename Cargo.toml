[package]
name = "axum-learn"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-macros = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2.0.21"
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "2.0.4"
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
# vendored：swagger-ui 静态文件随 crate 内置，避免编译期从 GitHub 下载失败
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
bytes = "1.12.1"
async-trait = "0.1.92"

[dev-dependencies]
serde_json = "1"   # 已有则不用加
tower = { version = "0.5", features = ["util"] }  # ServiceExt::oneshot
http-body-util = "0.1"  # 读取响应 body
